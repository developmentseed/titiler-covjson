# Dependabot: opens grouped PRs to update GitHub Actions pins and dependencies
# on a schedule. A cooldown holds back brand-new releases (see note below).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait this many days after a release before opening an update PR, so a
    # freshly published (possibly compromised or soon-yanked) version is not
    # adopted immediately. Only `default-days` applies here -- the
    # `semver-*-days` keys are not supported for the github-actions ecosystem.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    # Refresh uv.lock (including dev-tooling) on upstream releases, but never
    # rewrite the version bounds in pyproject.toml. Our runtime floors are the
    # library's compatibility contract and must rise only by deliberate
    # decision, not be ratcheted up on every dependency release (see issue #45).
    #
    # Version updates leave the following stale, so the monthly
    # refresh-lock.yml workflow re-locks every entry instead:
    #
    # - indirect dependencies, which the default `allow` excludes
    # - packages whose newest release requires a newer Python than our oldest
    #   supported one, even direct dependencies such as numpy
    #
    # Allowing every dependency type would cover only indirect dependencies, so
    # `allow` keeps its default.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    # See the cooldown note above; only `default-days` applies to the uv
    # ecosystem as well. Keep it equal to `exclude-newer` in pyproject.toml,
    # because uv applies that setting to Dependabot's runs too. With a shorter
    # cooldown here, Dependabot targets releases that uv refuses, and its job
    # errors instead of opening a pull request for that package.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
