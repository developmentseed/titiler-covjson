# Continuous integration on each code change: run the pre-commit checks once;
# type-check and run the test suite across the supported Python versions; and
# report coverage.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single source of truth for the Python matrix: derive it from the
  # `Programming Language :: Python :: 3.x` classifiers in pyproject.toml so the
  # typecheck and test jobs cannot drift from the project's declared support.
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python-versions: ${{ steps.derive.outputs.python-versions }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive Python versions from pyproject classifiers
        id: derive
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          classifier_prefix = "Programming Language :: Python :: "
          python_versions = [
              classifier.removeprefix(classifier_prefix)
              for classifier in pyproject["project"]["classifiers"]
              if classifier.startswith(classifier_prefix)
              and re.fullmatch(r"3\.\d+", classifier.removeprefix(classifier_prefix))
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as github_output:
              github_output.write(f"python-versions={json.dumps(python_versions)}\n")

  # Run the full pre-commit suite (ruff, formatting, actionlint, zizmor,
  # gitleaks, lockfile sync, file hygiene) so CI enforces the same checks a
  # developer runs locally -- defined once in .pre-commit-config.yaml, not
  # restated here. Backstops anyone who commits with --no-verify or without
  # the hooks installed.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --quiet
      - name: Run pre-commit hooks (prek)
        run: uv run --quiet prek run --all-files --show-diff-on-failure

  typecheck:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.python-versions) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --quiet
      - name: Type-check (mypy)
        run: uv run --quiet mypy

  # Test both ends of the dependency range (ADR-0002): `highest` (the committed
  # lockfile, today's default) across the full Python matrix, plus one
  # `lowest-direct` leg that resolves direct dependencies to their declared
  # floors. lowest-direct runs only on the Python floor (python-versions[0])
  # because the floors are chosen against that interpreter's available wheels;
  # both resolutions are blocking, so a floor set too low turns the build red.
  test:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.python-versions) }}
        resolution: [highest]
        # A single lowest-direct leg pinned to the Python floor; see the note
        # above for why it is not crossed with the full matrix.
        include:
          - python-version: ${{ fromJSON(needs.config.outputs.python-versions)[0] }}
            resolution: lowest-direct
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # Namespace the cache per resolution so the highest and lowest-direct
          # legs do not race to save an identical cache key.
          cache-suffix: ${{ matrix.resolution }}
      # `--resolution lowest-direct` re-resolves and cannot be combined with
      # `--locked` (uv ignores the lockfile when the resolution mode changes),
      # so each resolution has its own install step.
      - name: Install dependencies (highest, from lockfile)
        if: matrix.resolution == 'highest'
        run: uv sync --locked --quiet
      - name: Install dependencies (lowest-direct floors)
        if: matrix.resolution == 'lowest-direct'
        run: uv sync --resolution lowest-direct --quiet
      # `--no-sync` is load-bearing on the lowest-direct leg: `uv run` otherwise
      # syncs the environment to the lockfile first, silently replacing the
      # floors the previous step just installed, so the leg tested the locked
      # versions twice and no floor could ever turn it red. Harmless on the
      # highest leg, whose environment the lockfile sync already established.
      - name: Run tests (pytest)
        run: uv run --no-sync --quiet pytest

  # Coverage on the minimum supported Python (one canonical number, no matrix
  # gating). No API key: the text report goes to the job log and a markdown
  # table to the run's summary page.
  coverage:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python ${{ fromJSON(needs.config.outputs.python-versions)[0] }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ fromJSON(needs.config.outputs.python-versions)[0] }}
          enable-cache: true
          # This job runs on the minimum Python (python-versions[0]), the same
          # version as the `test` matrix's first entry. Without a distinct
          # suffix both jobs derive an identical setup-uv cache key and race to
          # save it, so one logs a "failed to save cache" warning. Namespace
          # this job's cache to keep the keys separate.
          cache-suffix: coverage
      - name: Install dependencies
        run: uv sync --locked --quiet
      - name: Run tests with coverage
        run: uv run --quiet pytest --cov --cov-report=term-missing
      - name: Write coverage summary to the job summary
        run: uv run --quiet coverage report --format=markdown --show-missing >> "$GITHUB_STEP_SUMMARY"

  # Prove the /bbox CoverageJSON slice end-to-end: guard the committed sample COG
  # against drift, build the demo image, and assert the running endpoint returns
  # valid, non-empty CoverageJSON. Two environments run here: the host uv env (dev
  # deps for check_sample.py's rasterio/numpy and smoke.py's jsonschema) and the
  # image's own no-dev runtime. Docker is preinstalled on ubuntu-latest, and the
  # default shallow checkout is fine (the drift guard is history-independent).
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: docker-smoke
      - name: Install host dependencies
        run: uv sync --locked --quiet
      - name: Guard the committed sample COG against drift
        run: uv run --quiet python docker/check_sample.py
      - name: Build the demo image
        run: docker build -f docker/Dockerfile -t titiler-covjson-demo .
      - name: Run the demo container
        run: docker run -d --name covjson-demo -p 8000:8000 titiler-covjson-demo
      - name: Smoke-check the running endpoint
        run: uv run --quiet python docker/smoke.py
      - name: Dump container logs on failure
        if: failure()
        run: docker logs covjson-demo || true
      - name: Stop the demo container
        if: always()
        run: docker rm -f covjson-demo || true

  # The single status check branch protection requires. The Python matrix is
  # derived from pyproject classifiers at run time, so the job names it produces
  # (`test (3.11, highest)`, `typecheck (3.12)`, ...) change whenever that
  # classifier list does. Requiring those names directly would leave protection
  # silently pointing at contexts nothing reports, so requiring this one
  # aggregate instead keeps the matrix free to change without a ruleset edit.
  ci-gate:
    needs: [config, checks, typecheck, test, coverage, docker-smoke]
    # Runs even when a dependency fails, so the gate reports a conclusion rather
    # than being skipped (a skipped required check never satisfies protection).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every upstream job succeeded
        # No job above is conditionally skipped, so success is the only result
        # that should let a merge through; treat the rest as a red build.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::At least one CI job did not succeed; see the run summary."
          exit 1
